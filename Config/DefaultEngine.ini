[/Script/EngineSettings.GameMapsSettings]
; M2: the prototype needs no level of its own. The engine's empty map plus the game mode
; spawn everything from code (see PeriapsisGameMode).
GameDefaultMap=/Engine/Maps/Entry.Entry
EditorStartupMap=/Engine/Maps/Entry.Entry
GlobalDefaultGameMode=/Script/PeriapsisGame.PeriapsisGameMode



[/Script/Engine.RendererSettings]
; Hardware ray tracing off at the start (spec section 13). Lumen stays on.
r.RayTracing=False
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1

[/Script/Engine.PhysicsSettings]
; Fixed-step asynchronous physics at 120 Hz: simulation logic is reproducible, and the
; physics bubble runs before every step (Docs/adr/0003-physics-bubble.md). With async physics
; Chaos ignores the substepping settings below; they are kept for when async is turned off.
bTickPhysicsAsync=True
AsyncFixedTimeStepSize=0.008333
bSubstepping=True
MaxSubstepDeltaTime=0.008333
MaxSubsteps=8

